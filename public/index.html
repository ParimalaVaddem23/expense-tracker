<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main>
    <header class="top">
      <h1>Expense Tracker</h1>
      <label>Month <input type="month" data-testid="month-input"></label>
    </header>

    <section class="summary" aria-live="polite">
      <p class="total"><span>Total spent</span> <strong data-testid="summary-total">0.00</strong></p>
      <ul data-testid="summary-breakdown" class="chips"></ul>
    </section>

    <section class="card">
      <h2 data-testid="form-title">Add expense</h2>
      <div class="form">
        <label>Amount <input type="number" step="0.01" min="0" data-testid="amount-input"></label>
        <label>Category <select data-testid="category-select"></select></label>
        <label>Date <input type="date" data-testid="date-input"></label>
        <label class="wide">Description <input type="text" maxlength="200" data-testid="description-input"></label>
        <div class="actions">
          <button type="button" class="primary" data-testid="add-btn">Add expense</button>
          <button type="button" data-testid="cancel-btn" hidden>Cancel</button>
        </div>
      </div>
      <p class="error" role="alert" data-testid="form-error" hidden></p>
    </section>

    <section class="card">
      <h2>Expenses</h2>
      <div class="form filters">
        <label>Category <select data-testid="filter-category"></select></label>
        <label>From <input type="date" data-testid="filter-from"></label>
        <label>To <input type="date" data-testid="filter-to"></label>
        <label>Sort
          <select data-testid="filter-sort">
            <option value="date_desc">Newest first</option>
            <option value="date_asc">Oldest first</option>
            <option value="amount_desc">Highest amount</option>
            <option value="amount_asc">Lowest amount</option>
          </select>
        </label>
        <div class="actions">
          <button type="button" data-testid="apply-filter">Apply filters</button>
          <button type="button" data-testid="clear-filter">Clear</button>
        </div>
      </div>

      <table>
        <thead><tr><th>Date</th><th>Category</th><th>Description</th><th class="num">Amount</th><th></th></tr></thead>
        <tbody data-testid="expense-list"></tbody>
      </table>
      <p class="empty" data-testid="empty-state" hidden>No expenses found. Add one above to get started.</p>
    </section>
  </main>
  <script src="/js/main.js"></script>
</body>
</html>
