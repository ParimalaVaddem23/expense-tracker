<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1 data-testid="app-title">Expense Tracker</h1>
  </header>

  <main class="container">
    <!-- Success / error banner -->
    <div id="message-banner" class="banner" data-testid="message-banner" role="status" hidden></div>

    <!-- Summary -->
    <section class="card" aria-labelledby="summary-heading">
      <h2 id="summary-heading">Summary</h2>
      <div class="summary-grid">
        <div class="stat">
          <span class="stat-label">Total amount</span>
          <span class="stat-value" id="summary-total" data-testid="summary-total">0.00</span>
        </div>
        <div class="stat">
          <span class="stat-label">Expenses</span>
          <span class="stat-value" id="summary-count" data-testid="summary-count">0</span>
        </div>
      </div>
      <ul id="summary-categories" class="category-list"></ul>
    </section>

    <!-- Add / Edit form -->
    <section class="card" aria-labelledby="form-heading">
      <h2 id="form-heading">Add expense</h2>
      <form id="expense-form" data-testid="expense-form" novalidate>
        <div class="form-grid">
          <div class="field">
            <label for="input-title">Title</label>
            <input id="input-title" name="title" type="text" data-testid="input-title" maxlength="200" autocomplete="off" />
            <p class="field-error" data-testid="form-error-title" id="error-title" hidden></p>
          </div>
          <div class="field">
            <label for="input-amount">Amount</label>
            <input id="input-amount" name="amount" type="number" step="any" data-testid="input-amount" />
            <p class="field-error" data-testid="form-error-amount" id="error-amount" hidden></p>
          </div>
          <div class="field">
            <label for="select-category">Category</label>
            <select id="select-category" name="category" data-testid="select-category">
              <option value="">Select a category</option>
            </select>
            <p class="field-error" data-testid="form-error-category" id="error-category" hidden></p>
          </div>
          <div class="field">
            <label for="input-date">Date</label>
            <input id="input-date" name="date" type="date" data-testid="input-date" />
            <p class="field-error" data-testid="form-error-date" id="error-date" hidden></p>
          </div>
          <div class="field field-wide">
            <label for="input-note">Note (optional)</label>
            <input id="input-note" name="note" type="text" data-testid="input-note" autocomplete="off" />
            <p class="field-error" data-testid="form-error-note" id="error-note" hidden></p>
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary" data-testid="btn-save">Save</button>
          <button type="button" class="btn" data-testid="btn-cancel" id="btn-cancel">Cancel</button>
        </div>
      </form>
    </section>

    <!-- Filters -->
    <section class="card" aria-labelledby="filter-heading">
      <h2 id="filter-heading">Filter</h2>
      <div class="filter-bar">
        <div class="field">
          <label for="filter-category">Category</label>
          <select id="filter-category" data-testid="filter-category">
            <option value="">All</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-from">From</label>
          <input id="filter-from" type="date" data-testid="filter-from" />
        </div>
        <div class="field">
          <label for="filter-to">To</label>
          <input id="filter-to" type="date" data-testid="filter-to" />
        </div>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="btn-apply-filter" data-testid="btn-apply-filter">Apply</button>
          <button type="button" class="btn" id="btn-clear-filter" data-testid="btn-clear-filter">Clear</button>
        </div>
      </div>
    </section>

    <!-- Expenses table -->
    <section class="card" aria-labelledby="list-heading">
      <h2 id="list-heading">Expenses</h2>
      <div class="table-wrap">
        <table id="expenses-table" data-testid="expenses-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Title</th>
              <th>Category</th>
              <th class="num">Amount</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="expenses-body"></tbody>
        </table>
      </div>
      <p id="empty-state" class="empty" data-testid="empty-state" hidden>No expenses found</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
